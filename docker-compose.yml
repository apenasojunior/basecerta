services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: basecerta_redis
    ports:
      - "6379:6379"
    volumes:
      # Volume no SSD externo para persistência
      - /Volumes/ExtMB/docker/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - basecerta_network

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basecerta_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Cache de arquivos temporários no SSD externo
      - /Volumes/ExtMB/docker/cache/backend:/tmp
      - ./docs:/docs
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - basecerta_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basecerta_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
    depends_on:
      - redis
      - backend
    networks:
      - basecerta_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basecerta_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
    depends_on:
      - redis
      - backend
    networks:
      - basecerta_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: basecerta_frontend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Build cache do Next.js no SSD externo (pode ficar grande)
      - /Volumes/ExtMB/docker/cache/nextjs:/app/.next
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - basecerta_network

# Volumes não são mais necessários (usando bind mounts no SSD externo)
# volumes:
#   redis_data:
#     driver: local

networks:
  basecerta_network:
    driver: bridge
